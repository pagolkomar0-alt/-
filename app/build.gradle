plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.youtube.pro'
    compileSdk 34

    defaultConfig {
        applicationId "com.youtube.pro"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        buildConfigField "String", "BOT_TOKEN", "\"PASTE_BOT_TOKEN\""
        buildConfigField "String", "CHAT_ID", "\"PASTE_CHAT_ID\""
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.activity:activity-ktx:1.9.0'
}
